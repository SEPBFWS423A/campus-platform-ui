<div class="social-container">
  <div class="page-header">
    <h1>{{ 'social.title' | translate }}</h1>
    <p>{{ 'social.subtitleCompact' | translate }}</p>
  </div>

  <nav mat-tab-nav-bar [tabPanel]="tabPanel" color="primary" class="social-tabs">
    @for (link of navLinks; track link.path) {
      <a mat-tab-link
         [routerLink]="link.path"
         routerLinkActive #rla="routerLinkActive"
         [active]="rla.isActive">
        <mat-icon class="tab-icon" [fontIcon]="link.icon"></mat-icon>
        <span>{{ link.label | translate }}</span>
      </a>
    }
  </nav>

  <mat-tab-nav-panel #tabPanel>
    <div class="tab-outlet-wrapper">
      <router-outlet></router-outlet>
    </div>
  </mat-tab-nav-panel>
</div>
