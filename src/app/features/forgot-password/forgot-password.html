<div class="forgot-password-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ 'forgotPassword.title' | translate }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="sendResetLink()">
        <p>{{ 'forgotPassword.instruction' | translate }}</p>
        <mat-form-field appearance="fill">
          <mat-label>{{ 'forgotPassword.emailLabel' | translate }}</mat-label>
          <input matInput formControlName="email" [readonly]="linkSent()">
        </mat-form-field>
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || isLoading() || linkSent()">
          @if (isLoading()) {
            <mat-spinner diameter="24"></mat-spinner>
          } @else {
            <span>{{ (linkSent() ? 'forgotPassword.resendButton' : 'forgotPassword.sendButton') | translate }}</span>
          }
        </button>
        @if (message()) {
          <div class="message">{{ message() }}</div>
        }
      </form>
    </mat-card-content>
  </mat-card>
</div>
