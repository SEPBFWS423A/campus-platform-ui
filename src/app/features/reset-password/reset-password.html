<div class="reset-password-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ 'resetPassword.title' | translate }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (!token) {
        <p class="message error">{{ 'resetPassword.invalidToken' | translate }}</p>
      } @else {
        <form [formGroup]="form" (ngSubmit)="resetPassword()">
          <mat-form-field appearance="fill">
            <mat-label>{{ 'resetPassword.newPasswordLabel' | translate }}</mat-label>
            <input matInput type="password" formControlName="password">
          </mat-form-field>
          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || isLoading() || isRedirecting()">
            @if (isLoading() || isRedirecting()) {
              <mat-spinner diameter="24"></mat-spinner>
            } @else {
              <span>{{ 'resetPassword.resetButton' | translate }}</span>
            }
          </button>
        </form>
      }

      @if (message()) {
        <div class="message" [class.success]="isRedirecting()" [class.error]="!isRedirecting() && message()">
          {{ message() }}
        </div>
      }
    </mat-card-content>
  </mat-card>
</div>
